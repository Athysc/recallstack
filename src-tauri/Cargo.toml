[package]
name = "recallstack"
version = "2.0.0"
description = "Local-first Markdown workspace"
authors = ["Sam Chiang <scdev@icloud.com>"]
license-file = "../LICENSE"
edition = "2021"

[features]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver", "dep:tracing-subscriber"]

[lib]
name = "recallstack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
notify = "8"
parking_lot = "0.12"
percent-encoding = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
thiserror = "2"
# Deleting a note/task/folder sends it to the OS trash (Recycle Bin / Trash /
# freedesktop Trash) instead of an app-managed folder. default-features only —
# the optional xdg_portal feature (zbus/ashpd) is deliberately left off.
trash = "5"
# e2e-only: tauri-plugin-wdio-webdriver's embedded WebDriver server reports
# startup/bind failures exclusively via `tracing::error!` (see its
# src/server/mod.rs) with no fallback — without a subscriber those events are
# silently dropped. Nothing in this app installs one otherwise, so CI runs
# that hit "the embedded server never comes up" (task_20260815_0002) have no
# way to show *why*. Gated to the e2e feature only — zero effect on
# production builds. default-features off, and "tracing-log" deliberately
# left out: that feature would additionally claim the `log` crate's global
# logger slot to bridge log->tracing, but tauri-plugin-wdio's own log
# forwarding (for @wdio/tauri-service's captureBackendLogs) already installs
# its own `log` logger on startup — confirmed locally that enabling
# tracing-log makes that install fail ("Failed to set global logger").
# tauri-plugin-wdio-webdriver's own diagnostics go through `tracing`
# directly, not the `log` crate, so this subscriber doesn't need that bridge.
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["fmt", "ansi", "std"] }
walkdir = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }

# zune-jpeg 0.5.15 (pulled in transitively via arboard -> image -> tiff) fails
# to compile on current stable rustc: a `warn!(...)` call used as a block's
# tail expression hits "macro expansion ends with an incomplete expression".
# Vendored from upstream's 0.5.16-rc1 (adds the missing trailing `;`, no other
# changes), version bumped to plain 0.5.16 so it satisfies tiff's `^0.5.1` req.
[patch.crates-io]
zune-jpeg = { path = "vendor/zune-jpeg-0.5.16-patched" }
