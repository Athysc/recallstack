name: Build reviewed release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - run: npm run release:verify
      - name: Release performance timing
        id: perf
        # Known-flaky class of failure, same as frontend-e2e.yml's desktop
        # E2E step: @wdio/tauri-service's embedded WebDriver provider can
        # time out on its first command in CI before the app's build/package
        # steps below ever run — see tests/e2e/wdio.conf.mjs and
        # task_20260815_0002. That's a performance-timing measurement, not
        # the actual release artifact, so it must not block the real build
        # below when it fails. Do not remove continue-on-error without
        # addressing that first.
        continue-on-error: true
        run: npm run test:release:performance
      - name: Note release performance timing failure
        if: steps.perf.outcome == 'failure'
        shell: bash
        run: |
          echo "### :warning: Release performance timing failed on windows-portable" >> "$GITHUB_STEP_SUMMARY"
          echo "\`npm run test:release:performance\` did not complete — see that step's log above. The build below still ran and this artifact upload still includes the real package; it just has no performance-results/windows.json this run. See task_20260815_0002." >> "$GITHUB_STEP_SUMMARY"
      - run: npm run release:clean
      - run: npm run build:windows:portable
      - run: npm run package:windows:portable
      - uses: actions/upload-artifact@v6
        with:
          name: recallstack-windows-portable
          path: |
            release/
            performance-results/windows.json
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update
      - run: sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 xvfb
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run release:verify
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
      - name: Release performance timing
        id: perf
        # Known-flaky class of failure, same as frontend-e2e.yml's desktop
        # E2E step: @wdio/tauri-service's embedded WebDriver provider can
        # time out on its first command in CI before the app's build/package
        # steps below ever run — see tests/e2e/wdio.conf.mjs and
        # task_20260815_0002. That's a performance-timing measurement, not
        # the actual release artifact, so it must not block the real build
        # below when it fails. Do not remove continue-on-error without
        # addressing that first.
        continue-on-error: true
        run: npm run test:release:performance
      - name: Note release performance timing failure
        if: steps.perf.outcome == 'failure'
        run: |
          echo "### :warning: Release performance timing failed on linux" >> "$GITHUB_STEP_SUMMARY"
          echo "\`npm run test:release:performance\` did not complete — see that step's log above. The build below still ran and this artifact upload still includes the real package; it just has no performance-results/linux.json this run. See task_20260815_0002." >> "$GITHUB_STEP_SUMMARY"
      - run: npm run release:clean
      - run: npm run build:linux
      - run: npm run package:linux:tar
      - run: npm run build:linux:appimage
      - run: npm run package:linux:appimage
      - uses: actions/upload-artifact@v6
        with:
          name: recallstack-linux
          path: |
            release/
            performance-results/linux.json
          if-no-files-found: error

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - run: npm run release:verify
      - run: npm run release:clean
      - run: npm run build:macos:app
      - run: npm run package:macos:app
      - uses: actions/upload-artifact@v6
        with:
          name: recallstack-macos
          path: release/
          if-no-files-found: error
